    const sets=db.sets.filter(s=>s.stream===u.stream);
    root.innerHTML=welcome('ПАНЕЛЬ УЧИТЕЛЯ',`Здравствуйте, ${esc(u.name.split(' ')[0])}.<br><span>Пусть знания встретятся.</span>`,'Создавайте наборы вопросов, публикуйте их для классов и следите за тем, как ребята повторяют материал.','Материал → вопросы → дуэль','Ученики из 11А и 11Б уже могут встретиться в одном рейтинговом цикле.')+
      `<div class="tabs"><button class="tab active" data-tab="sets">Наборы</button><button class="tab" data-tab="results">Результаты</button><button class="tab" data-tab="class">Мои классы</button></div>
      <section class="panel active" id="panel-sets"><div class="row wrap section-head"><div><h2>Ваши наборы</h2><p class="sub">Для рейтингового режима нужно минимум 15 вопросов.</p></div><button class="btn btn-primary" id="newSet">＋ Создать набор</button></div><div class="grid">${sets.map(s=>`<article class="card set-card"><div class="row"><span class="tag">${esc(s.subject||'Предмет')}</span><span class="badge ${s.published?'status-done':''}">${s.published?'Опубликован':'Черновик'}</span></div><div style="margin-top:20px"><h3>${esc(s.title)}</h3><div class="tiny">${esc(s.classNames.join(', '))} · ${s.questions.length} вопросов</div></div><div class="bottom row"><span class="tiny">${esc(s.cycle||'Цикл 1')}</span><button class="btn btn-light edit-set" data-id="${s.id}">Открыть</button></div></article>`).join('')||'<div class="empty">Пока нет наборов. Создайте первый, чтобы начать.</div>'}</div></section>
      <section class="panel" id="panel-results"><div class="section-head"><h2>Результаты учеников</h2><p class="sub">Точность только в рейтинговых боях. Практика в рейтинг не входит.</p></div>${teacherResults(students,sets)}</section>
      <section class="panel" id="panel-class"><div class="row section-head"><div><h2>${esc(u.stream)}</h2><p class="sub">Общий поток для параллельных классов.</p></div><button class="btn btn-light" id="inviteStudent">＋ Добавить ученика</button></div><div class="notice">Код потока для приглашения: <strong>SCHOLA11</strong>. Ученики из 11А и 11Б могут играть друг с другом.</div><div class="grid" style="margin-top:16px">${students.map(s=>`<article class="card"><div class="opponent"><div class="avatar">${esc(s.name.slice(0,1))}</div><div><strong>${esc(s.name)}</strong><div class="tiny">${esc(s.className)} · ${esc(s.stream)}</div></div></div></article>`).join('')}</div></section>`;
    root.innerHTML=translate(root.innerHTML);
    root.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{root.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));root.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+b.dataset.tab))});
    document.getElementById('newSet').onclick=()=>openSetEditor();root.querySelectorAll('.edit-set').forEach(b=>b.onclick=()=>openSetEditor(b.dataset.id));
    document.getElementById('inviteStudent').onclick=()=>modal(`<div class="row"><h2>Добавить ученика</h2><button class="btn btn-ghost" onclick="window.krugClose()">Закрыть</button></div><p class="sub">В реальном продукте ученик войдёт по коду потока. В прототипе добавьте профиль, чтобы переключаться между участниками.</p><div class="field"><label>Имя</label><input id="newStudentName" placeholder="Например, Аружан"></div><div class="field"><label>Класс</label><select id="newStudentClass"><option>11А</option><option>11Б</option></select></div><button class="btn btn-primary" id="addStudent">Добавить</button>`);document.getElementById('addStudent')?.addEventListener('click',()=>{const name=document.getElementById('newStudentName').value.trim();if(!name)return toast('Введите имя');db.users.push({id:uid(),name,role:'student',className:document.getElementById('newStudentClass').value,stream:u.stream});save();closeModal();render();toast('Ученик добавлен')});
  }
  function teacherResults(students,sets){if(!sets.length)return '<div class="empty">Опубликуйте набор, чтобы здесь появились результаты.</div>';let rows=[];for(const s of students)for(const set of sets){const bs=db.battles.filter(b=>b.setId===set.id&&b.status==='done'&&b.participants.includes(s.id));const attempts=bs.map(b=>b.attempts[s.id]).filter(Boolean);const correct=attempts.reduce((n,a)=>n+a.answers.filter((v,i)=>v===a.questions[i].correct).length,0);const total=attempts.reduce((n,a)=>n+a.questions.length,0);rows.push(`<tr><td>${esc(s.name)} <span class="tiny">${esc(s.className)}</span></td><td>${esc(set.title)}</td><td>${bs.length}/3</td><td><strong>${correct}/${total||0}</strong></td><td>${bs.filter(b=>b.winner===s.id).length}</td></tr>`)}return `<div class="table-wrap"><table><thead><tr><th>Ученик</th><th>Набор</th><th>Бои</th><th>Верно</th><th>Победы</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
  function openSetEditor(id){const existing=id?setById(id):null;let qs=existing?existing.questions.map(q=>({text:q[0],options:[...q[1]],correct:q[2],explanation:q[3]})):[];modal(`<div class="row"><div><div class="eyebrow">КОНСТРУКТОР НАБОРА</div><h2>${existing?'Редактировать набор':'Новый набор вопросов'}</h2></div><button class="btn btn-ghost" onclick="window.krugClose()">Закрыть</button></div><p class="sub">Добавьте минимум 15 вопросов, чтобы опубликовать набор и открыть рейтинговые бои.</p><div class="form-grid"><div class="field"><label>Название темы</label><input id="setTitle" value="${esc(existing?.title||'')}" placeholder="Например, Первая мировая война"></div><div class="field"><label>Предмет</label><input id="setSubject" value="${esc(existing?.subject||'')}" placeholder="История"></div><div class="field"><label>Классы</label><input id="setClasses" value="${esc(existing?.classNames.join(', ')||'11А, 11Б')}" placeholder="11А, 11Б"></div><div class="field"><label>Рейтинговый цикл</label><input id="setCycle" value="${esc(existing?.cycle||'Цикл 1')}" placeholder="Цикл 1"></div></div><div id="questionList" class="q-list"></div><div class="q-editor"><h3>Добавить вопрос</h3><div class="field"><label>Вопрос</label><input id="qText" placeholder="Напишите вопрос"></div><div class="form-grid"><div class="field"><label>Вариант А</label><input id="q0"></div><div class="field"><label>Вариант Б</label><input id="q1"></div><div class="field"><label>Вариант В</label><input id="q2"></div><div class="field"><label>Вариант Г</label><input id="q3"></div></div><div class="form-grid"><div class="field"><label>Правильный вариант</label><select id="qCorrect"><option value="0">А</option><option value="1">Б</option><option value="2">В</option><option value="3">Г</option></select></div><div class="field"><label>Пояснение после ответа</label><input id="qExplain" placeholder="Короткое объяснение"></div></div><button class="btn btn-light" id="addQuestion">＋ Добавить вопрос</button></div><div class="divider"></div><div class="row"><span class="tiny" id="qCount"></span><div class="row"><button class="btn btn-light" id="saveDraft">Сохранить черновик</button><button class="btn btn-primary" id="publishSet">${existing?.published?'Сохранить и опубликовать':'Опубликовать'}</button></div></div>`);
    const draw=()=>{document.getElementById('qCount').textContent=translate(`${qs.length} вопросов`);document.getElementById('questionList').innerHTML=translate(qs.map((q,i)=>`<div class="q-item"><div><strong>${i+1}. ${esc(q.text)}</strong><div class="tiny">Правильный ответ: ${letters[q.correct]} · ${esc(q.options[q.correct])}</div></div><button class="btn btn-ghost remove-q" data-i="${i}">Удалить</button></div>`).join('')||'<div class="tiny">Вопросы появятся здесь</div>');document.querySelectorAll('.remove-q').forEach(b=>b.onclick=()=>{qs.splice(+b.dataset.i,1);draw()})};draw();
    document.getElementById('addQuestion').onclick=()=>{const text=document.getElementById('qText').value.trim(),options=[0,1,2,3].map(i=>document.getElementById('q'+i).value.trim()),correct=+document.getElementById('qCorrect').value,explanation=document.getElementById('qExplain').value.trim();if(!text||options.some(x=>!x))return toast('Заполните вопрос и все четыре варианта');qs.push({text,options,correct,explanation});['qText','q0','q1','q2','q3','qExplain'].forEach(x=>document.getElementById(x).value='');draw()};
    const persist=published=>{const title=document.getElementById('setTitle').value.trim();if(!title)return toast('Укажите название набора');if(published&&qs.length<15)return toast('Для публикации добавьте минимум 15 вопросов');const payload={id:existing?.id||uid(),title,subject:document.getElementById('setSubject').value.trim()||'Предмет',cycle:document.getElementById('setCycle').value.trim()||'Цикл 1',published,stream:user().stream,classNames:document.getElementById('setClasses').value.split(',').map(x=>x.trim()).filter(Boolean),questions:qs.map(q=>[q.text,q.options,q.correct,q.explanation])};if(existing)Object.assign(existing,payload);else db.sets.unshift(payload);save();closeModal();render();toast(published?'Набор опубликован':'Черновик сохранён')};document.getElementById('saveDraft').onclick=()=>persist(false);document.getElementById('publishSet').onclick=()=>persist(true)
  }
  function studentSetList(u){return db.sets.filter(s=>s.published&&s.stream===u.stream&&s.classNames.includes(u.className))}
  function battleCount(userId,setId){return db.battles.filter(b=>b.setId===setId&&b.participants.includes(userId)&&b.status!=='cancelled').length}
  function renderStudent(u){const sets=studentSetList(u);const outstanding=db.battles.filter(b=>b.participants.includes(u.id)&&b.status!=='done');const completed=db.battles.filter(b=>b.participants.includes(u.id)&&b.status==='done');root.innerHTML=welcome(`УЧЕНИК · ${esc(u.className)}`,`Привет, ${esc(u.name)}.<br><span>Готов проверить себя?</span>`,'Сыграй рейтинговые бои с ребятами из потока, а потом спокойно повтори весь материал.','До 3 боёв на набор','Оба соперника получают одинаковые вопросы. Результат откроется, когда закончат оба.')+
    `<div class="tabs"><button class="tab active" data-tab="play">Играть</button><button class="tab" data-tab="inbox">Вызовы <span class="badge">${outstanding.length}</span></button><button class="tab" data-tab="practice">Повторение</button><button class="tab" data-tab="history">Мои результаты</button></div><section class="panel active" id="panel-play"><div class="section-head"><h2>Доступные темы</h2><p class="sub">Соперник может быть из любого класса потока.</p></div><div class="grid">${sets.map(s=>{const used=battleCount(u.id,s.id);return `<article class="card set-card"><div class="row"><span class="tag">${esc(s.subject)}</span><span class="badge">${Math.max(0,3-used)} боя осталось</span></div><div style="margin-top:20px"><h3>${esc(s.title)}</h3><div class="tiny">${s.questions.length} вопросов · ${esc(s.classNames.join(' и '))}</div></div><div class="bottom"><div class="progress"><span style="width:${Math.min(100,used/3*100)}%"></span></div><button class="btn btn-primary challenge-btn" data-id="${s.id}" ${used>=3?'disabled':''}>Найти соперника</button></div></article>`}).join('')||'<div class="empty">Пока нет опубликованных наборов для вашего класса.</div>'}</div><div class="section-head"><h2>Активные бои</h2></div>${battleList(outstanding,u)}</section>
    <section class="panel" id="panel-inbox"><div class="section-head"><h2>Вызовы и незавершённые бои</h2><p class="sub">Чтобы посмотреть второго участника, переключите профиль в правом верхнем углу.</p></div>${battleList(outstanding,u)}</section>
    <section class="panel" id="panel-practice"><div class="section-head"><h2>Спокойное повторение</h2><p class="sub">Все вопросы набора, без таймера и без влияния на рейтинг.</p></div><div class="grid">${sets.map(s=>`<article class="card set-card"><span class="tag">${esc(s.subject)}</span><div style="margin-top:20px"><h3>${esc(s.title)}</h3><div class="tiny">${s.questions.length} вопросов целиком</div></div><div class="bottom"><button class="btn btn-light practice-btn" data-id="${s.id}">Начать повторение</button></div></article>`).join('')||'<div class="empty">Наборы появятся здесь после публикации учителем.</div>'}</div></section>
    <section class="panel" id="panel-history"><div class="section-head"><h2>Завершённые бои</h2><p class="sub">Практика не меняет результаты рейтинговых боёв.</p></div>${battleList(completed,u,true)}</section>`;
    root.innerHTML=translate(root.innerHTML);
    root.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{root.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));root.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+b.dataset.tab))});root.querySelectorAll('.challenge-btn').forEach(b=>b.onclick=()=>createBattle(u,b.dataset.id));root.querySelectorAll('.practice-btn').forEach(b=>b.onclick=()=>startPractice(u,setById(b.dataset.id)));
    root.querySelectorAll('.battle-open').forEach(b=>b.onclick=()=>openBattle(b.dataset.id,u));root.querySelectorAll('.accept-btn').forEach(b=>b.onclick=()=>acceptBattle(b.dataset.id,u));
  }
  function battleList(battles,u,doneOnly=false){if(!battles.length)return '<div class="empty">Здесь пока пусто. Найдите соперника для нового боя.</div>';return battles.map(b=>{const s=setById(b.setId),other=db.users.find(x=>x.id!==u.id&&b.participants.includes(x.id));const my=b.attempts[u.id],otherDone=other&&b.attempts[other.id]?.submitted;const myDone=my?.submitted;const title=s?.title||'Набор';const status=b.status==='done'?'Завершён':myDone?'Вы ответили · ждём соперника':b.pendingFor===u.id?'Вызов вам':'Ваш ход';return `<article class="card challenge-card"><div class="opponent"><div class="avatar ${b.status==='done'?'blue':''}">${esc(other?.name.slice(0,1)||'?')}</div><div><strong>${esc(other?.name||'Соперник')} · ${esc(title)}</strong><div class="tiny">${esc(other?.className||'')} · ${b.questions.length} вопросов · ${status}</div></div></div><div class="row">${b.pendingFor===u.id&&!myDone?`<button class="btn btn-light accept-btn" data-id="${b.id}">Принять бой</button>`:`<button class="btn ${b.status==='done'?'btn-light':'btn-primary'} battle-open" data-id="${b.id}">${b.status==='done'?'Результат':myDone?'Ожидание':'Продолжить'}</button>`}</div></article>`}).join('')}
  function createBattle(u,setId){const s=setById(setId);if(battleCount(u.id,setId)>=3)return toast('Вы сыграли 3 рейтинговых боя по этой теме');const pool=db.users.filter(x=>x.role==='student'&&x.stream===u.stream&&x.id!==u.id&&s.classNames.includes(x.className)&&battleCount(x.id,setId)<3);if(!pool.length)return toast('Пока нет подходящего соперника с доступными боями');const opponent=pool[Math.floor(Math.random()*pool.length)];const questions=[...s.questions].sort(()=>Math.random()-.5).slice(0,Math.max(5,Math.floor(s.questions.length/3))).map(q=>({text:q[0],options:q[1],correct:q[2],explanation:q[3]}));const b={id:uid(),setId,participants:[u.id,opponent.id],pendingFor:opponent.id,status:'active',questions,attempts:{[u.id]:{answers:Array(questions.length).fill(null),submitted:false},[opponent.id]:{answers:Array(questions.length).fill(null),submitted:false}},createdAt:Date.now(),winner:null};db.battles.unshift(b);save();render();toast(`Вызов отправлен: ${opponent.name}`)}
  function acceptBattle(id,u){const b=db.battles.find(x=>x.id===id);if(!b)return;b.pendingFor=null;save();openBattle(id,u)}
  function openBattle(id,u){const b=db.battles.find(x=>x.id===id);if(!b)return;const s=setById(b.setId),mine=b.attempts[u.id];if(!mine)return toast('Этот бой не для вашего профиля');if(b.status==='done'){showBattleResult(b,u);return}if(b.pendingFor===u.id){toast('Сначала примите вызов');return}if(mine.submitted){toast('Ответы сохранены. Ждём соперника.');return}showQuiz({title:s.title,questions:b.questions,initialAnswers:mine.answers,onFinish:answers=>{mine.answers=answers;mine.submitted=true;const other=b.participants.find(x=>x!==u.id);if(b.attempts[other].submitted){b.status='done';const scoreA=score(b,b.participants[0]),scoreB=score(b,b.participants[1]);b.winner=scoreA===scoreB?null:(scoreA>scoreB?b.participants[0]:b.participants[1])}save();closeModal();render();if(b.status==='done')showBattleResult(b,u);else toast('Готово! Результат откроется, когда соперник ответит.')}})}
  function score(b,id){const a=b.attempts[id];return a.answers.filter((v,i)=>v===b.questions[i].correct).length}
  function showBattleResult(b,u){const otherId=b.participants.find(x=>x!==u.id),other=db.users.find(x=>x.id===otherId),mine=b.attempts[u.id],their=b.attempts[otherId];const myScore=score(b,u.id),theirScore=score(b,otherId);const status=b.winner===u.id?'Победа!':b.winner===otherId?'В этот раз победил соперник':'Ничья';modal(`<div class="row"><div><div class="eyebrow">РЕЗУЛЬТАТ БОЯ</div><h2>${status}</h2></div><button class="btn btn-ghost" onclick="window.krugClose()">Закрыть</button></div><div class="stat-row"><div class="stat"><div class="result-score">${myScore}<span class="tiny">/${b.questions.length}</span></div><div class="tiny">${esc(u.name)} · верно</div></div><div class="stat"><div class="result-score">${theirScore}<span class="tiny">/${b.questions.length}</span></div><div class="tiny">${esc(other.name)} · верно</div></div><div class="stat"><div class="metric">${b.winner?b.winner===u.id?'＋':'−':'＝'}</div><div class="tiny">Итог</div></div></div>${b.questions.map((q,i)=>{const ok=mine.answers[i]===q.correct;return `<div class="q-item"><div><strong class="${ok?'correct':'incorrect'}">${ok?'✓':'×'} ${i+1}. ${esc(q.text)}</strong><div class="tiny">Верно: ${letters[q.correct]} · ${esc(q.options[q.correct])}${q.explanation?' — '+esc(q.explanation):''}</div></div></div>`}).join('')}<div class="divider"></div><button class="btn btn-primary" onclick="window.krugClose();window.krugRender()">Готово</button>`)}
  function showQuiz({title,questions,initialAnswers,onFinish,practice=false}){let answers=[...initialAnswers],at=answers.findIndex(x=>x===null);if(at<0)at=questions.length-1;let finished=false;const paint=()=>{const q=questions[at];document.getElementById('modal').innerHTML=translate(`<div class="match-head row"><div><div class="eyebrow">${practice?'РЕЖИМ ПОВТОРЕНИЯ':'АСИНХРОННАЯ ДУЭЛЬ'}</div><h2>${esc(title)}</h2></div><button class="btn btn-ghost" id="quitQuiz">Закрыть</button></div><div class="card question-card"><div class="row"><span class="tiny">Вопрос ${at+1} из ${questions.length}</span><span class="badge">${practice?'Без рейтинга':'Рейтинговый бой'}</span></div><div class="progress"><span style="width:${(at+1)/questions.length*100}%"></span></div><h3 style="font-size:20px;line-height:1.45;margin:20px 0">${esc(q.text)}</h3><div>${q.options.map((o,i)=>`<button class="option ${answers[at]===i?'selected':''}" data-i="${i}"><span class="letter">${letters[i]}</span>${esc(o)}</button>`).join('')}</div><div class="row" style="margin-top:22px"><button class="btn btn-light" id="prevQ" ${at===0?'disabled':''}>Назад</button><button class="btn btn-primary" id="nextQ">${at===questions.length-1?(practice?'Завершить повторение':'Отправить ответы'):'Далее'}</button></div></div>`);document.getElementById('quitQuiz').onclick=()=>{if(practice)closeModal();else{closeModal();render()}};document.querySelectorAll('.option').forEach(x=>x.onclick=()=>{answers[at]=+x.dataset.i;paint()});document.getElementById('prevQ').onclick=()=>{if(at>0){at--;paint()}};document.getElementById('nextQ').onclick=()=>{if(answers[at]===null)return toast('Выберите ответ');if(at<questions.length-1){at++;while(at<questions.length&&answers[at]!==null)at++;if(at>=questions.length)at=questions.length-1;paint()}else{if(answers.some(x=>x===null))return toast('Ответьте на все вопросы');finished=true;onFinish(answers)}}};modal('');paint()}
  function startPractice(u,s){const qs=s.questions.map(q=>({text:q[0],options:q[1],correct:q[2],explanation:q[3]}));showQuiz({title:s.title,questions:qs,initialAnswers:Array(qs.length).fill(null),practice:true,onFinish:answers=>{const correct=answers.filter((x,i)=>x===qs[i].correct).length;modal(`<div class="eyebrow">ПОВТОРЕНИЕ ЗАВЕРШЕНО</div><h2>Хорошая работа!</h2><div class="result-score">${correct}<span class="tiny">/${qs.length}</span></div><p class="sub">Верных ответов. Это занятие не повлияло на рейтинг.</p><button class="btn btn-primary" onclick="window.krugClose()">Закрыть</button>`)}})}
  window.krugClose=closeModal;window.krugRender=render;
  render();
})();
</script>
