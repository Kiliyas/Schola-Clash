<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f9">
  <meta name="description" content="Schola Clash turns classroom review into friendly asynchronous duels.">
  <title>Schola Clash — Learn together. Compete kindly.</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" defer></script>
  <script src="supabase/client-config.js" defer></script>
  <script src="supabase/client.js" defer></script>
  <script src="supabase/live-app.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Schola Clash home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>schola<span class="brand-accent">clash</span></span>
      </a>
      <div class="topbar-right">
        <span class="environment-pill"><span class="environment-dot"></span><span id="accountStatus">Connecting</span></span>
        <span class="role-badge" id="roleBadge" hidden></span>
        <button class="button button-outline topbar-auth" id="authButton" type="button">Sign in</button>
      </div>
    </header>
    <main id="app" class="main-shell" tabindex="-1"></main>
    <footer class="app-footer">
      <span>Schola Clash</span>
      <span>Progress first. Competition second.</span>
    </footer>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
